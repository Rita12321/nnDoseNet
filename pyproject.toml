[project]
name = "nndosenet"
version = "2.2.1"
requires-python = ">=3.9"
description = "nnU-Net is a framework for out-of-the box image segmentation."
readme = "readme.md"
license = { file = "LICENSE" }
authors = [
    { name = "Fabian Isensee", email = "f.isensee@dkfz-heidelberg.de"},
    { name = "Helmholtz Imaging Applied Computer Vision Lab" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    'deep learning',
    'image segmentation',
    'semantic segmentation',
    'medical image analysis',
    'medical image segmentation',
    'nnU-Net',
    'nnunet'
]
dependencies = [
    "torch>=2.0.0",
    "acvl-utils>=0.2",
    "dynamic-network-architectures>=0.2",
    "tqdm",
    "dicom2nifti",
    "scipy",
    "batchgenerators>=0.25",
    "numpy",
    "scikit-learn",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.2.1",
    "pandas",
    "graphviz",
    'tifffile',
    'requests',
    "nibabel",
    "matplotlib",
    "seaborn",
    "imagecodecs",
    "yacs"
]

[project.urls]
homepage = "https://github.com/Rita12321/nnUNetv2"
repository = "https://github.com/Rita12321/nnUNetv2"

[project.scripts]
nnDoseNet_plan_and_preprocess = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:plan_and_preprocess_entry"
nnDoseNet_extract_fingerprint = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:extract_fingerprint_entry"
nnDoseNet_plan_experiment = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:plan_experiment_entry"
nnDoseNet_preprocess = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:preprocess_entry"
nnDoseNet_train = "nndosenet.run.run_training:run_training_entry"
nnDoseNet_predict_from_modelfolder = "nndosenet.inference.predict_from_raw_data:predict_entry_point_modelfolder"
nnDoseNet_predict = "nndosenet.inference.predict_from_raw_data:predict_entry_point"
nnDoseNet_convert_old_nnUNet_dataset = "nndosenet.dataset_conversion.convert_raw_dataset_from_old_nnunet_format:convert_entry_point"
nnDoseNet_find_best_configuration = "nndosenet.evaluation.find_best_configuration:find_best_configuration_entry_point"
nnDoseNet_determine_postprocessing = "nndosenet.postprocessing.remove_connected_components:entry_point_determine_postprocessing_folder"
nnDoseNet_apply_postprocessing = "nndosenet.postprocessing.remove_connected_components:entry_point_apply_postprocessing"
nnDoseNet_ensemble = "nndosenet.ensembling.ensemble:entry_point_ensemble_folders"
nnDoseNet_accumulate_crossval_results = "nndosenet.evaluation.find_best_configuration:accumulate_crossval_results_entry_point"
nnDoseNet_plot_overlay_pngs = "nndosenet.utilities.overlay_plots:entry_point_generate_overlay"
nnDoseNet_download_pretrained_model_by_url = "nndosenet.model_sharing.entry_points:download_by_url"
nnDoseNet_install_pretrained_model_from_zip = "nndosenet.model_sharing.entry_points:install_from_zip_entry_point"
nnDoseNet_export_model_to_zip = "nndosenet.model_sharing.entry_points:export_pretrained_model_entry"
nnDoseNet_move_plans_between_datasets = "nndosenet.experiment_planning.plans_for_pretraining.move_plans_between_datasets:entry_point_move_plans_between_datasets"
nnDoseNet_evaluate_folder = "nndosenet.evaluation.evaluate_predictions:evaluate_folder_entry_point"
nnDoseNet_evaluate_simple = "nndosenet.evaluation.evaluate_predictions:evaluate_simple_entry_point"
nnDoseNet_convert_MSD_dataset = "nndosenet.dataset_conversion.convert_MSD_dataset:entry_point"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pre-commit"
]

[tool.codespell]
skip = '.git,*.pdf,*.svg'
#
# ignore-words-list = ''
