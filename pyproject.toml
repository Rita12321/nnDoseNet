[project]
name = "nndosenet"
version = "1.0.0"
requires-python = ">=3.9"
description = "nnDoseNet is a flexible and intuitive framework for dose prediction in radiotherapy planning."
readme = "readme.md"
license = { file = "LICENSE" }
authors = [{ name = "nnDoseNet contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    'deep learning',
    'deep learning framework',
    'radiation oncology',
    'radiotherapy',
    'treatment planning',
    'dose prediction',
    'RT dose prediction',
    'medical image analysis',
    'nnDoseNet',
]
dependencies = [
    "torch>=2.0.0",
    "acvl-utils>=0.2,<0.3", 
    "dynamic-network-architectures>=0.2,<0.4",
    "tqdm",
    "dicom2nifti",
    "scipy",
    "batchgenerators>=0.25",
    "numpy",
    "scikit-learn",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.2.1",
    "pandas",
    "pydicom",
    "pymedphys",
    "graphviz",
    "tifffile",
    "torchviz",
    "requests",
    "rt-utils",
    "nibabel",
    "matplotlib",
    "seaborn",
    "imagecodecs",
    "yacs"
]

[project.urls]
homepage = "https://github.com/Rita12321/nnDoseNet"
repository = "https://github.com/Rita12321/nnDoseNet"

[tool.setuptools.packages.find]
include = ["nndosenet*"]

[project.scripts]
# Stage 0 — DICOM organization and structure review
nnDoseNet_0-0_list_dicom_and_organize = "nndosenet.formating_dataset.format_dataset_entrypoints:list_dicom_entry"
nnDoseNet_0-1_list_roi = "nndosenet.formating_dataset.format_dataset_entrypoints:list_roi_entry"
nnDoseNet_0-2a_suggest_structure_csv = "nndosenet.formating_dataset.format_dataset_entrypoints:suggest_structure_csv_entry"
nnDoseNet_0-2b_csv_to_structure_json = "nndosenet.formating_dataset.format_dataset_entrypoints:csv_to_structure_json_entry"
nnDoseNet_0-2_suggest_structure = "nndosenet.formating_dataset.format_dataset_entrypoints:suggest_structure_entry"
nnDoseNet_0-3_list_target = "nndosenet.formating_dataset.format_dataset_entrypoints:list_target_entry"

# Stage 1 — DICOM conversion, labeling, and beam export
nnDoseNet_1_format_dataset = "nndosenet.formating_dataset.format_dataset_entrypoints:format_dataset_entry"
nnDoseNet_1-1_convert_dicom_image = "nndosenet.formating_dataset.format_dataset_entrypoints:convert_dicom_image_entry"
nnDoseNet_1-2_label_nifti = "nndosenet.formating_dataset.format_dataset_entrypoints:label_nifti_entry"
nnDoseNet_1-3_beam_export = "nndosenet.formating_dataset.format_dataset_entrypoints:beam_export_entry"
# Backward-compatible aliases
nnDoseNet_1-1_organize_and_convert_dicom = "nndosenet.formating_dataset.format_dataset_entrypoints:convert_dicom_image_entry"
nnDoseNet_1-2_label_nifti_and_final_formatting = "nndosenet.formating_dataset.format_dataset_entrypoints:label_nifti_entry"

nnDoseNet_2_plan_and_preprocess = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:plan_and_preprocess_entry"
nnDoseNet_2-1_extract_fingerprint = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:extract_fingerprint_entry"
nnDoseNet_2-2_plan_experiment = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:plan_experiment_entry"
nnDoseNet_2-3_preprocess = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:preprocess_entry"

nnDoseNet_3_train = "nndosenet.run.run_training:run_training_entry"
nnDoseNet_3_find_best_configuration = "nndosenet.ensembling.find_best_configuration:find_best_configuration_entry_point"

nnDoseNet_4_predict = "nndosenet.inference.predict_from_raw_data:predict_entry_point"
nnDoseNet_4_predict_Ts = "nndosenet.inference.predict_from_raw_data:predict_Ts_entry_point"

nnDoseNet_4_accumulate_crossval_results = "nndosenet.evaluation.find_best_configuration:accumulate_crossval_results_entry_point"
nnDoseNet_4_ensemble = "nndosenet.ensembling.ensemble:entry_point_ensemble_folders"

nnDoseNet_5_evaluate_folder = "nndosenet.evaluation.evaluate_predictions:evaluate_folder_entry_point"
nnDoseNet_5_dicom_based_evaluation= "nndosenet.evaluation.dicom_based_evaluation:nii2dcm_and_gamma_analysis_entry_point"
nnDoseNet_5_dicom_based_evaluation_Ts= "nndosenet.evaluation.dicom_based_evaluation:nii2dcm_and_gamma_analysis_Ts_entry_point"
nnDoseNet_5_diff_map_evaluation="nndosenet.evaluation.difference_map:entrypoint_diff_map"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pre-commit"
]

[tool.codespell]
skip = '.git,*.pdf,*.svg'
#
# ignore-words-list = ''
