[project]
name = "nndosenet"
version = "1.0.0"
requires-python = ">=3.9"
description = "nnDoseNet is a flexible and intuitive framework for dose prediction in radiotherapy planning."
readme = "readme.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ho-Hsin (Rita) Chang", email = "changh@uab.edu"},
    { name = "University of Alabama at Birmingham Radiation Oncolgy Dr. Carlos E. Cardenas' Lab" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    'deep learning',
    'deep learning framework',
    'radiation oncology',
    'radiotherapy',
    'treatment planning',
    'dose prediction',
    'RT dose prediction',
    'medical image analysis',
    'nnDoseNet',
]
dependencies = [
    "torch>=2.0.0",
    "acvl-utils>=0.2,<0.3", 
    "dynamic-network-architectures>=0.2,<0.4",
    "tqdm",
    "dicom2nifti",
    "scipy",
    "batchgenerators>=0.25",
    "numpy",
    "scikit-learn",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.2.1",
    "pandas",
    "pydicom",
    "pymedphys",
    "graphviz",
    "tifffile",
    "torchviz",
    "requests",
    "rt-utils",
    "nibabel",
    "matplotlib",
    "seaborn",
    "imagecodecs",
    "yacs"
]

[project.urls]
homepage = "https://github.com/Rita12321/nnDoseNet"
repository = "https://github.com/Rita12321/nnDoseNet"

[project.scripts]
nnDoseNet_format_dataset = "nndosenet.formating_dataset.format_dataset_entrypoints:format_dataset_entry"
nnDoseNet_label_nifti_and_final_formatting = "nndosenet.formating_dataset.format_dataset_entrypoints:label_nifti_and_final_formatting_entry"
nnDoseNet_organize_and_convert_dicom = "nndosenet.formating_dataset.format_dataset_entrypoints:organize_and_convert_dicom_entry"
nnDoseNet_plan_and_preprocess = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:plan_and_preprocess_entry"
nnDoseNet_extract_fingerprint = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:extract_fingerprint_entry"
nnDoseNet_plan_experiment = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:plan_experiment_entry"
nnDoseNet_preprocess = "nndosenet.experiment_planning.plan_and_preprocess_entrypoints:preprocess_entry"
nnDoseNet_train = "nndosenet.run.run_training:run_training_entry"
nnDoseNet_predict = "nndosenet.inference.predict_from_raw_data:predict_entry_point"
nnDoseNet_predict_Ts = "nndosenet.inference.predict_from_raw_data:predict_Ts_entry_point"
nnDoseNet_find_best_configuration = "nndosenet.evaluation.find_best_configuration:find_best_configuration_entry_point"
nnDoseNet_ensemble = "nndosenet.ensembling.ensemble:entry_point_ensemble_folders"
nnDoseNet_accumulate_crossval_results = "nndosenet.evaluation.find_best_configuration:accumulate_crossval_results_entry_point"
nnDoseNet_plot_overlay_pngs = "nndosenet.utilities.overlay_plots:entry_point_generate_overlay"
nnDoseNet_download_pretrained_model_by_url = "nndosenet.model_sharing.entry_points:download_by_url"
nnDoseNet_install_pretrained_model_from_zip = "nndosenet.model_sharing.entry_points:install_from_zip_entry_point"
nnDoseNet_export_model_to_zip = "nndosenet.model_sharing.entry_points:export_pretrained_model_entry"
nnDoseNet_evaluate_folder = "nndosenet.evaluation.evaluate_predictions:evaluate_folder_entry_point"
nnDoseNet_dicom_based_evaluation= "nndosenet.evaluation.dicom_based_evaluation:entry_point_nii2dcm_and_gamma_analysis"
nnDoseNet_diff_map_evaluation="nndosenet.evaluation.difference_map:entrypoint_diff_map"
[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pre-commit"
]

[tool.codespell]
skip = '.git,*.pdf,*.svg'
#
# ignore-words-list = ''
